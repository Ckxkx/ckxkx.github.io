#---------------------------
# 鏂囩珷椤?
# Post Page
#---------------------------
post:
  banner_img: /img/鏂囩珷鑳屾櫙.webp
  banner_img_height: 70
  banner_mask_alpha: 0.3

  # 鏂囩珷鍦ㄩ椤电殑榛樿灏侀潰鍥撅紝褰撴病鏈夋寚瀹?index_img 鏃朵細浣跨敤璇ュ浘鐗囷紝鑻ヤ袱鑰呴兘涓虹┖鍒欎笉鏄剧ず浠讳綍鍥剧墖
  # Path of the default post cover when `index_img` is not set. If both are empty, no image will be displayed
  default_index_img: /img/棣栭〉鑳屾櫙.webp

  # 鏂囩珷鏍囬涓嬫柟鐨勫厓淇℃伅
  # Meta information below title
  meta:
    # 浣滆€咃紝浼樺厛鏍规嵁 front-matter 閲?author 瀛楁锛屽叾娆℃槸 hexo 閰嶇疆涓?author 鍊?
    # Author, based on `author` field in front-matter, if not set, based on `author` value in hexo config
    author:
      enable: false

    # 鏂囩珷鏃ユ湡锛屼紭鍏堟牴鎹?front-matter 閲?date 瀛楁锛屽叾娆℃槸 md 鏂囦欢鏃ユ湡
    # Post date, based on `date` field in front-matter, if not set, based on create date of .md file
    date:
      enable: true
      # 鏍煎紡鍙傜収 ISO-8601 鏃ユ湡鏍煎紡鍖?
      # ISO-8601 date format
      # See: http://momentjs.cn/docs/#/parsing/string-format/
      format: "LL a"

    # 瀛楁暟缁熻
    # Word count
    wordcount:
      enable: true

    # 浼拌闃呰鍏ㄦ枃闇€瑕佺殑鏃堕暱
    # Estimated reading time
    min2read:
      enable: true
      # 姣忎釜瀛楄瘝鐨勯暱搴︼紝寤鸿锛氫腑鏂団増2锛岃嫳鏂団増5锛屼腑鑻辨贩鍚堝彲鑷璋冭妭
      # Average word length (chars count in word), ZH 鈮?2, EN 鈮?5
      awl: 2
      # 姣忓垎閽熼槄璇诲瓧鏁帮紝濡傛灉澶ч儴鍒嗘槸鎶€鏈枃绔犲彲閫傚害璋冧綆
      # Words per minute
      wpm: 60

    # 娴忚閲忚鏁?
    # Number of visits
    views:
      enable: false
      # 缁熻鏁版嵁鏉ユ簮
      # Data Source
      # Options: busuanzi | leancloud | umami
      source: "busuanzi"

  # 鍦ㄦ枃绔犲紑澶存樉绀烘枃绔犳洿鏂版椂闂达紝璇ユ椂闂撮粯璁ゆ槸 md 鏂囦欢鏇存柊鏃堕棿锛屽彲閫氳繃 front-matter 涓?`updated` 鎵嬪姩鎸囧畾锛堝拰 date 涓€鏍锋牸寮忥級
  # Update date is displayed at the beginning of the post. The default date is the update date of the md file, which can be manually specified by `updated` in front-matter (same format as date)
  updated:
    enable: false

    # 鏍煎紡鍙傜収 ISO-8601 鏃ユ湡鏍煎紡鍖?
    # ISO-8601 date format
    # See: http://momentjs.cn/docs/#/parsing/string-format/
    date_format: "LL a"

    # 鏄惁浣跨敤鐩稿鏃堕棿琛ㄧず锛屾瘮濡傦細"3 澶╁墠"
    # If true, it will be a relative time, such as: "3 days ago"
    relative: false

    # 鎻愮ず鏍囩绫诲瀷
    # Note class
    # Options: default | primary | info | success | warning | danger | light
    note_class: info

  # 渚ц竟鏍忓睍绀哄綋鍓嶅垎绫讳笅鐨勬枃绔?
  # Sidebar of category
  category_bar:
    enable: true

    # 寮€鍚悗锛屽彧鏈夊湪鏂囩珷 Front-matter 閲屾寚瀹?`category_bar: true` 鎵嶄細灞曠ず鍒嗙被锛屼篃鍙互閫氳繃 `category_bar: ["鍒嗙被A"]` 鏉ユ寚瀹氬垎绫?
    # If true, only set `category_bar: true` in Front-matter will enable sidebar of category, also set `category_bar: ["CategoryA"]` to specify categories
    specific: true

    # 缃簬鏉垮潡鐨勫乏渚ф垨鍙充晶
    # place in the board
    # Options: left | right
    placement: left

    # 鏂囩珷鐨勬帓搴忓瓧娈碉紝鍓嶉潰甯﹀噺鍙锋槸鍊掑簭锛屼笉甯﹀噺鍙锋槸姝ｅ簭
    # Sort field for posts, with a minus sign is reverse order
    # Options: date | title | or other field of front-matter
    post_order_by: "title"

    # 鍗曚釜鍒嗙被涓姌鍙犲睍绀烘枃绔犳暟鐨勬渶澶у€硷紝瓒呰繃闄愬埗浼氭樉绀?More锛? 鍒欎笉闄愬埗
    # The maximum number of posts in a single category. If the limit is exceeded, it will be displayed More. If 0 no limit
    post_limit: 0

  # 渚ц竟鏍忓睍绀烘枃绔犵洰褰?
  # Table of contents (TOC) in the sidebar
  toc:
    enable: true
    # 杩涘叆鏂囩珷鏃舵槸鍚﹂粯璁ゅ睍寮€鍏ㄩ儴鐩綍
    # Expand all TOC items on enter
    expand_all: true

    # 缃簬鏉垮潡鐨勫乏渚ф垨鍙充晶
    # place in the board
    # Options: left | right
    placement: right

    # 鐩綍浼氶€夋嫨杩欎簺鑺傜偣浣滀负鏍囬
    # TOC will select these nodes as headings
    headingSelector: "h1,h2,h3,h4,h5,h6"

    # 灞傜骇鐨勬姌鍙犳繁搴︼紝0 鏄叏閮ㄦ姌鍙狅紝澶т簬 0 鍚庡鏋滃瓨鍦ㄤ笅绾ф爣棰樺垯榛樿灞曞紑
    # Collapse depth. If 0, all headings collapsed. If greater than 0, it will be expanded by default if there are sub headings
    collapseDepth: 0

  # 鐗堟潈澹版槑锛屼細鏄剧ず鍦ㄦ瘡绡囨枃绔犵殑缁撳熬
  # Copyright, will be displayed at the end of each post
  copyright:
    enable: true

    # CreativeCommons license
    # See: https://creativecommons.org/share-your-work/cclicenses/
    # Options: BY | BY-SA | BY-ND | BY-NC | BY-NC-SA | BY-NC-ND | ZERO
    license: 'BY'

    # 鏄剧ず浣滆€?
    author:
      enable: true

    # 鏄剧ず鍙戝竷鏃ユ湡
    # Show post date
    post_date:
      enable: true
      format: "LL"

    # 鏄剧ず鏇存柊鏃ユ湡
    # Show update date
    update_date:
      enable: false
      format: "LL"

  # 鏂囩珷搴曢儴涓婁竴绡囦笅涓€绡囧姛鑳?
  # Link to previous/next post
  prev_next:
    enable: true

  # 鏂囩珷鍥剧墖鏍囬
  # Image caption
  image_caption:
    enable: true

  # 鏂囩珷鍥剧墖鍙偣鍑绘斁澶?
  # Zoom feature of images
  image_zoom:
    enable: true
    # 鏀惧ぇ鍚庡浘鐗囬摼鎺ユ浛鎹㈣鍒欙紝鍙敤浜庡皢鍘嬬缉鍥剧墖閾炬帴鏇挎崲涓哄師鍥剧墖閾炬帴锛屽 ['-slim', ''] 鏄皢閾炬帴涓?`-slim` 绉婚櫎锛涘鏋滄兂浣跨敤姝ｅ垯璇蜂娇鐢?`re:` 鍓嶇紑锛屽 ['re:\\d{3,4}\\/\\d{3,4}\\/', '']
    # The image url replacement when zooming, the feature can be used to replace the compressed image to the original image, eg: ['-slim', ''] removes `-slim` from the image url when zooming; if you want to use regular, use prefix `re:`, eg: ['re:\\d{3,4}\\/\\d{3,4}\\/','']
    img_url_replace: ['', '']

  # 鑴氭敞璇硶锛屼細鍦ㄦ枃绔犲簳閮ㄧ敓鎴愯剼娉紝濡傛灉 Markdown 娓叉煋鍣ㄦ湰韬敮鎸侊紝鍒欏缓璁叧闂紝鍚﹀垯鍙兘浼氬啿绐?
  # Support footnote syntax, footnotes will be generated at the bottom of the post page. If the Markdown renderer itself supports it, please disable it, otherwise it may conflict
  footnote:
    enable: true
    # 鑴氭敞鐨勮妭鏍囬锛屼篃鍙互鍦?front-matter 涓€氳繃 `footnote: <h2>Reference</h2>` 杩欑褰㈠紡淇敼鍗曠嫭椤甸潰鐨?header
    # The section title of the footnote, you can also modify the header of a single page in the form of `footnote: <h2>Reference</h2>` in front-matter
    header: ''

  # 鏁板鍏紡锛屽紑鍚箣鍓嶉渶瑕佹洿鎹?Markdown 娓叉煋鍣紝鍚﹀垯澶嶆潅鍏紡浼氭湁鍏煎闂锛屽叿浣撹瑙侊細https://fluid.ist/docs/guide/##latex-鏁板鍏紡
  # Mathematical formula. If enable, you need to change the Markdown renderer, see: https://fluid.ist/docs/en/guide/#math
  math:
    # 寮€鍚悗鏂囩珷榛樿鍙敤锛岃嚜瀹氫箟椤甸潰濡傞渶浣跨敤锛岄渶鍦?Front-matter 涓寚瀹?`math: true`
    # If you want to use math on the custom page, you need to set `math: true` in Front-matter
    enable: false

    # 寮€鍚悗锛屽彧鏈夊湪鏂囩珷 Front-matter 閲屾寚瀹?`math: true` 鎵嶄細鍦ㄦ枃绔犻〉鍚姩鍏紡杞崲锛屼互渚垮湪椤甸潰涓嶅寘鍚叕寮忔椂鎻愰珮鍔犺浇閫熷害
    # If true, only set `math: true` in Front-matter will enable math, to load faster when the page does not contain math
    specific: false

    # Options: mathjax | katex
    engine: mathjax

  # 娴佺▼鍥撅紝鍩轰簬 mermaid-js锛屽叿浣撹瑙侊細https://fluid.ist/docs/guide/#mermaid-娴佺▼鍥?
  # Flow chart, based on mermaid-js, see: https://fluid.ist/docs/en/guide/#mermaid
  mermaid:
    # 寮€鍚悗鏂囩珷榛樿鍙敤锛岃嚜瀹氫箟椤甸潰濡傞渶浣跨敤锛岄渶鍦?Front-matter 涓寚瀹?`mermaid: true`
    # If you want to use mermaid on the custom page, you need to set `mermaid: true` in Front-matter
    enable: true

    # 寮€鍚悗锛屽彧鏈夊湪鏂囩珷 Front-matter 閲屾寚瀹?`mermaid: true` 鎵嶄細鍦ㄦ枃绔犻〉鍚姩鍏紡杞崲锛屼互渚垮湪椤甸潰涓嶅寘鍚叕寮忔椂鎻愰珮鍔犺浇閫熷害
    # If true, only set `mermaid: true` in Front-matter will enable mermaid, to load faster when the page does not contain mermaid
    specific: true

    # See: http://mermaid-js.github.io/mermaid/
    options: { theme: 'default' }

  # 璇勮鎻掍欢
  # Comment plugin
  comments:
    enable: false
    # 鎸囧畾鐨勬彃浠讹紝闇€瑕佸悓鏃惰缃搴旀彃浠剁殑蹇呰鍙傛暟
    # The specified plugin needs to set the necessary parameters at the same time
