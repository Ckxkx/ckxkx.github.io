# 鎸囧畾鑷畾涔?.js 鏂囦欢璺緞锛屾敮鎸佸垪琛紱璺緞鏄浉瀵?source 鐩綍锛屽 /js/custom.js 瀵瑰簲瀛樻斁鐩綍 source/js/custom.js
# Specify the path of your custom js file, support list. The path is relative to the source directory, such as `/js/custom.js` corresponding to the directory `source/js/custom.js`
custom_head: |
  <meta name="google-site-verification" content="EVQuf-Vxc1N_Ii-5zfnRii2kYjpeYCtt2qOmpiq0bds" />
custom_js:

# 鎸囧畾鑷畾涔?.css 鏂囦欢璺緞锛岀敤娉曞拰 custom_js 鐩稿悓
# The usage is the same as custom_js
custom_css: /css/custom-v3.css
# 缃戦〉璁块棶缁熻
# Analysis of website visitors
web_analytics:
  enable: false

  # 閬靛惊璁垮娴忚鍣?璇峰嬁杩借釜"鐨勮缃紝濡傛灉寮€鍚垯涓嶇粺璁″叾璁块棶
  # Follow the "Do Not Track" setting of the visitor's browser
  # See: https://www.w3.org/TR/tracking-dnt/
  follow_dnt: true

  # 鐧惧害缁熻鐨?Key锛屽€奸渶瑕佽幏鍙栦笅鏂归摼鎺ヤ腑 `hm.js?` 鍚庤竟鐨勫瓧绗︿覆
  # Baidu analytics, get the string behind `hm.js?`
  # See: https://tongji.baidu.com/sc-web/10000033910/home/site/getjs?siteId=13751376
  baidu:

  # Google Analytics 4 鐨勫獟浣撹祫婧?ID
  # Google Analytics 4 MEASUREMENT_ID
  # See: https://support.google.com/analytics/answer/9744165#zippy=%2Cin-this-article
  google:
    measurement_id:

  # 鑵捐缁熻鐨?H5 App ID锛屽紑鍚珮绾у姛鑳芥墠鏈塩id
  # Tencent analytics, set APP ID
  # See: https://mta.qq.com/h5/manage/ctr_app_manage
  tencent:
    sid:
    cid:

  # LeanCloud 璁℃暟缁熻锛屽彲鐢ㄤ簬 PV UV 灞曠ず锛屽鏋?`web_analytics: enable` 娌℃湁寮€鍚紝PV UV 灞曠ず鍙細鏌ヨ涓嶄細澧炲姞
  # LeanCloud count statistics, which can be used for PV UV display. If `web_analytics: enable` is false, PV UV display will only query and not increase
  leancloud:
    app_id:
    app_key:
    # REST API 鏈嶅姟鍣ㄥ湴鍧€锛屽浗闄呯増涓嶅～
    # Only the Chinese mainland users need to set
    server_url:
    # 缁熻椤甸潰鏃惰幏鍙栬矾寰勭殑灞炴€?
    # Get the attribute of the page path during statistics
    path: window.location.pathname
    # 寮€鍚悗涓嶇粺璁℃湰鍦拌矾寰? localhost 涓?127.0.0.1 )
    # If true, ignore localhost & 127.0.0.1
    ignore_local: false

  # OpenKounter 璁℃暟缁熻锛堝熀浜?EdgeOne Pages锛夛紝鍙敤浜?PV UV 灞曠ず
  # OpenKounter count statistics (based on EdgeOne Pages), which can be used for PV UV display
  # See: https://github.com/Mintimate/open-kounter
  openkounter:
    # OpenKounter API 鏈嶅姟鍣ㄥ湴鍧€
    # OpenKounter API server URL
    server_url: https://open-kounter.mintimate.cn
    # 缁熻椤甸潰鏃惰幏鍙栬矾寰勭殑灞炴€э紝閫氬父浣跨敤 window.location.pathname
    # Get the attribute of the page path during statistics
    path: window.location.pathname
    # 寮€鍚悗涓嶇粺璁℃湰鍦拌矾寰勶紙localhost銆?27.0.0.1銆乕::1]锛?
    # If true, ignore localhost & 127.0.0.1 & [::1]
    ignore_local: false

  # Umami Analytics锛屼粎鏀寔鑷儴缃层€傚鏋滆灞曠ず PV UV 闇€瑕佸～鍐欐墍鏈夐厤缃」锛屽惁鍒欏彧濉啓 `src` 鍜?`website_id` 鍗冲彲
  # Umami Analytics, only Self-host support. If you want to display PV UV need to set all config items, otherwise only set 'src' and 'website_id'
  # See: https://umami.is/docs
  umami:
    # umami js 鏂囦欢鍦板潃锛岄渶瑕佸湪 umami 鍚庡彴鍒涘缓绔欑偣鍚庤幏鍙?
    # umami js file url, get after create website in umami
    src:

    # umami 鐨?website id锛岄渶瑕佸湪 umami 鍚庡彴鍒涘缓绔欑偣鍚庤幏鍙?
    # umami website id, get after create website in umami
    website_id:

    # 濡傛灉浣犲彧鎯崇粺璁＄壒瀹氱殑鍩熷悕鍙互濉叆姝ゅ瓧娈碉紝澶氫釜鍩熷悕閫氳繃閫楀彿鍒嗛殧锛岃繖鍙互閬垮厤缁熻 localhost銆?
    # If you only want to tracker to specific domains you can fill in this field, multiple domain names are separated by commas, which can avoid tracker localhost
    domains:

    # 鐢ㄤ簬缁熻 PV UV 鐨勫紑濮嬫椂闂达紝鏍煎紡涓?"YYYY-MM-DD"
    # statistics on the start time, the format is "YYYY-MM-DD"
    start_time: 2024-01-01

    # 鏂板缓涓€涓?umami viewOnly 鐢ㄦ埛锛岀劧鍚庨€氳繃 login api 鑾峰彇璇ョ敤鎴?token
    # create an umami viewOnly user, and then get user token through the login api
    token:

    # 濉啓 umami 閮ㄧ讲鐨勬湇鍔″櫒鍦板潃锛屽 "https://umami.example.com"
    # server url of umami deployment, such as "https://umami.example.com"
    api_server:

# Canonical 鐢ㄤ簬鍚?Google 鎼滅储鎸囧畾瑙勮寖缃戝潃锛屽紑鍚墠纭繚 hexo _config.yml 涓厤缃?`url: http://yourdomain.com`
# Canonical, to specify a canonical URL for Google Search, need to set up `url: http://yourdomain.com` in hexo _config.yml
# See: https://support.google.com/webmasters/answer/139066
canonical:
  enable: false

# 瀵归〉闈腑鐨勫浘鐗囧拰璇勮鎻掍欢杩涜鎳掑姞杞藉鐞嗭紝鍙鑼冨洿澶栫殑鍏冪礌涓嶄細鎻愬墠鍔犺浇
# Lazy loading of images and comment plugin on the page
lazyload:
  enable: true

  # 鍔犺浇鏃剁殑鍗犱綅鍥剧墖
  # The placeholder image when loading
  loading_img: /img/loading.gif

  # 寮€鍚悗鎳掑姞杞戒粎鍦ㄦ枃绔犻〉鐢熸晥锛屽鏋滆嚜瀹氫箟椤甸潰闇€瑕佷娇鐢紝鍙互鍦?Front-matter 閲屾寚瀹?`lazyload: true`
  # If true, only enable lazyload on the post page. For custom pages, you can set 'lazyload: true' in front-matter
  onlypost: false

  # 瑙﹀彂鍔犺浇鐨勫亸绉诲€嶆暟锛屽熀鏁版槸瑙嗙獥楂樺害锛屽彲鏍规嵁閮ㄧ讲鐜鐨勮姹傞€熷害璋冭妭
  # The factor of viewport height that triggers loading
  offset_factor: 2

# 鍥炬爣搴擄紝鍖呭惈浜嗗ぇ閲忕ぞ浜ょ被鍥炬爣锛屼富棰樹緷璧栫殑涓嶅寘鍚湪鍐咃紝鍥犳鍙嚜琛屼慨鏀癸紝璇﹁ https://fluid.ist/docs/icon/
# Icon library, which includes many social icons, does not include those theme dependent, so your can modify link by yourself. See: https://fluid.ist/docs/en/icon/
iconfont: //at.alicdn.com/t/c/font_1736178_k526ubmyhba.css


